[package]
name = "aim"
version = "0.1.0"
edition = "2024"
description = "AppImage manager: install, remove, integrate, update, gc"
license = "MIT"
repository = "https://github.com/Tokinouta/AppImage-Manager"
homepage = "https://github.com/Tokinouta/AppImage-Manager"
readme = "README.md"

[[bin]]
name = "aim"
path = "src/main.rs"

[lib]
name = "aim"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "string"] }

# Errors
miette = { version = "7.5", features = ["fancy"] }
thiserror = "2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["display", "preserve_order"] }

# Paths
dirs = "5"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Logging / output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = { version = "0.17", features = ["unicode-width"] }
owo-colors = { version = "4.2", features = ["supports-colors"] }

# Filesystem
tempfile = "3"

# HTTP
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "redactions"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
